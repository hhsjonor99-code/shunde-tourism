<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 朱红印泥底（带轻微旋转与不规则边缘） -->
  <g transform="rotate(-2 32 32)">
    <rect x="6" y="6" width="52" height="52" rx="2" fill="#C41E3A" opacity="0.92"/>
    <rect x="6" y="6" width="52" height="52" rx="2" fill="none" stroke="#7a1622" stroke-width="1" opacity="0.55"/>
  </g>
  <!-- 印章文字 "顺"（行楷风，居中） -->
  <text
    x="32"
    y="44"
    text-anchor="middle"
    font-family="'Ma Shan Zheng', 'STKaiti', 'KaiTi', 'KaiTi SC', serif"
    font-size="36"
